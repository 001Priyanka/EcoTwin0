AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EcoTwin Kolhapur read-only environmental API

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        CORS_ORIGINS: !Ref CorsOrigins

Parameters:
  CorsOrigins:
    Type: String
    Default: http://localhost:5173

Resources:
  EcoTwinApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/lambda.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/lambda.ts
        Target: es2022
        Sourcemap: true
